name: bench
on:
  workflow_dispatch:
    inputs:
      style:
        description: "full (whole sentence, full pinyin) or wordabbr (a word at a time as initials)"
        required: true
        default: "full"
      from:
        description: "first row (0-based)"
        required: false
        default: "0"
      count:
        description: "how many rows (all when empty)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  apple-pinyin:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: sw_vers -productVersion; xcodebuild -version; xcrun simctl list runtimes | grep iOS
      - name: Simulator with Apple Pinyin
        id: sim
        run: |
          bash ci/setup_sim.sh > udid.txt
          echo "udid=$(tail -1 udid.txt)" >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          TEST_RUNNER_BENCH_STYLE: ${{ inputs.style }}
          TEST_RUNNER_BENCH_FROM: ${{ inputs.from }}
          TEST_RUNNER_BENCH_COUNT: ${{ inputs.count }}
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          bash ci/reset_daemon.sh "${{ steps.sim.outputs.udid }}" > daemon.log 2>&1 &
          xcodebuild test -project PinyinBench.xcodeproj -scheme BenchHost -sdk iphonesimulator -only-testing:BenchUITests/BenchTests \
            -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath result.xcresult CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || echo "xcodebuild exit $?"
          grep -E '^(ROW|MISPICK|RESETFAILED|INTRO)\||error:|Test Case|\*\* TEST' test.log || { echo "no result lines; last lines:"; tail -60 test.log; }
      - name: Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ inputs.style }}-${{ inputs.from }}
          path: test.log
          retention-days: 14
