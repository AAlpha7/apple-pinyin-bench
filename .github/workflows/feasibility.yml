name: feasibility
on: workflow_dispatch
permissions:
  contents: read
jobs:
  apple-pinyin:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: sw_vers -productVersion; xcodebuild -version; xcrun simctl list runtimes | grep iOS
      - name: Simulator with Apple Pinyin
        id: sim
        run: echo "udid=$(ci/setup_sim.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild test -project PinyinBench.xcodeproj -scheme BenchHost -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath result.xcresult CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E '^(KEYBOARD|NODE|NODE_OUTSIDE|PICK|LAT)\||error:|Test Case|\*\* TEST' || true
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.xcresult
          retention-days: 7
