name: feasibility
on:
  workflow_dispatch:
    inputs:
      only:
        description: "one test class (ProbeTests, FeasibilityTests); all when empty"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  apple-pinyin:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: sw_vers -productVersion; xcodebuild -version; xcrun simctl list runtimes | grep iOS
      - name: Simulator with Apple Pinyin
        id: sim
        run: |
          bash ci/setup_sim.sh > udid.txt
          echo "udid=$(tail -1 udid.txt)" >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          ONLY: ${{ inputs.only }}
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          bash ci/reset_daemon.sh "${{ steps.sim.outputs.udid }}" > daemon.log 2>&1 &
          xcodebuild test -project PinyinBench.xcodeproj -scheme BenchHost -sdk iphonesimulator ${ONLY:+-only-testing:BenchUITests/$ONLY} \
            -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath result.xcresult CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || echo "xcodebuild exit $?"
          grep -E '(KEYBOARD|NODE|NODE_OUTSIDE|PICK|LAT|FIELD|SPRINGBOARD|OCR|BUTTON|SCREEN|TREE|INTRO|BAR|TAP|SPACE|OCRCHECK|SCREEN1|SCREEN2|ABOVEKEYS|GRID|PREDICT|LEARN|TWICE|RESET|FILES|BARCHANGED|DAEMON)\||error:|Test Case|\*\* TEST' test.log || { echo "no result lines; last lines:"; tail -60 test.log; }
          sort daemon.log | uniq -c | head -40
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.xcresult
          retention-days: 7
